name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m unittest discover -s tests
      - name: Reproduce the frozen Review 2 evaluation
        run: python -W ignore scripts/reproduce_r2.py
